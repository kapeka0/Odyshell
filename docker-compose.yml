services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: odyshell
      POSTGRES_USER: odyshell
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a URL-safe random value}
    ports:
      - "127.0.0.1:${ODYSHELL_POSTGRES_PORT:-55432}:5432"
    volumes:
      - odyshell-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odyshell"]
      interval: 2s
      timeout: 2s
      retries: 20

  server:
    init: true
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      NODE_ENV: production
      ODYSHELL_DEPLOYMENT_MODE: self-hosted
      PORT: 4100
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://odyshell:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a URL-safe random value}@postgres:5432/odyshell
      ODYSHELL_WEB_KEY: ${ODYSHELL_WEB_KEY:?Set ODYSHELL_WEB_KEY to at least 32 random characters}
      ODYSHELL_WEB_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      ODYSHELL_MCP_URL: ${ODYSHELL_MCP_URL:-http://localhost:4100/mcp}
      ODYSHELL_IDENTITY_ISSUER: ${BETTER_AUTH_URL:-http://localhost:3000}
      ODYSHELL_IDENTITY_JWKS_URL: http://web:3000/api/auth/jwks
      ODYSHELL_IDENTITY_JWKS_ALLOW_HTTP: "true"
      ODYSHELL_MCP_ALLOWED_ORIGINS: ${BETTER_AUTH_URL:-http://localhost:3000}
      ODYSHELL_COMMAND_OUTPUT_RETENTION_DAYS: ${ODYSHELL_COMMAND_OUTPUT_RETENTION_DAYS:-30}
      ODYSHELL_AUDIT_RETENTION_DAYS: ${ODYSHELL_AUDIT_RETENTION_DAYS:-30}
    ports:
      - "${ODYSHELL_BIND_ADDRESS:-127.0.0.1}:${ODYSHELL_SERVER_PORT:-4100}:4100"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4100/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 3s
      timeout: 2s
      retries: 20

  web:
    init: true
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_ODYSHELL_SERVER_URL: ${NEXT_PUBLIC_ODYSHELL_SERVER_URL:-http://localhost:4100}
        NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_AUTH_ENABLED:-false}
        NEXT_PUBLIC_OIDC_AUTH_ENABLED: ${NEXT_PUBLIC_OIDC_AUTH_ENABLED:-false}
        NEXT_PUBLIC_OIDC_PROVIDER_ID: ${NEXT_PUBLIC_OIDC_PROVIDER_ID:-oidc}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://odyshell:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a URL-safe random value}@postgres:5432/odyshell
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET to at least 32 random characters}
      ODYSHELL_DEPLOYMENT_MODE: self-hosted
      ODYSHELL_RUN_IDENTITY_MIGRATIONS: "true"
      ODYSHELL_MCP_URL: ${ODYSHELL_MCP_URL:-http://localhost:4100/mcp}
      NEXT_PUBLIC_ODYSHELL_SERVER_URL: ${NEXT_PUBLIC_ODYSHELL_SERVER_URL:-http://localhost:4100}
      ODYSHELL_SERVER_URL: http://server:4100
      ODYSHELL_WEB_KEY: ${ODYSHELL_WEB_KEY:?Set ODYSHELL_WEB_KEY to at least 32 random characters}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NEXT_PUBLIC_GOOGLE_AUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_AUTH_ENABLED:-false}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_PROVIDER_ID: ${OIDC_PROVIDER_ID:-oidc}
      NEXT_PUBLIC_OIDC_AUTH_ENABLED: ${NEXT_PUBLIC_OIDC_AUTH_ENABLED:-false}
      NEXT_PUBLIC_OIDC_PROVIDER_ID: ${NEXT_PUBLIC_OIDC_PROVIDER_ID:-oidc}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "${ODYSHELL_BIND_ADDRESS:-127.0.0.1}:${ODYSHELL_WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 3s
      timeout: 2s
      retries: 30

volumes:
  odyshell-postgres:
